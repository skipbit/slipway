# Production-like stack: the standalone Next image + Postgres.
# Self-contained (NOT an override of docker-compose.yml) so the dev bind mount
# can never shadow the built image.
#
#   docker compose -f docker-compose.prod.yml up --build   # http://localhost:3000
#
# `migrate` applies pending migrations once (from the builder stage, which has the
# Prisma CLI) before the slim runner starts.
#
# The explicit project name keeps this stack out of the dev stack's namespace.
# Without it both files resolve to the same `slipway-app` image tag and the same
# `slipway_pgdata` volume, so building here would replace the dev image (which
# has the Prisma CLI the prod runner lacks) and `down -v` would drop the dev
# database.
name: slipway-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: slipway
      POSTGRES_PASSWORD: slipway
      POSTGRES_DB: slipway
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slipway -d slipway"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: builder
    command: npx prisma migrate deploy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://slipway:slipway@db:5432/slipway?schema=public
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://slipway:slipway@db:5432/slipway?schema=public
      # Fail fast with a clear message if AUTH_SECRET is unset/empty in .env.
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET is required — set it in .env (openssl rand -base64 32)}"
      # Runtime base URL for emailed links. The NEXT_PUBLIC_APP_URL build arg
      # above is baked into the image; this one is not, so a deployed image can
      # send reset links that point at the real host. Required rather than
      # defaulted: a localhost default is exactly the silent failure this
      # variable exists to prevent.
      APP_URL: "${APP_URL:?APP_URL is required — the origin password reset emails link to}"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
