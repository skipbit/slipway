name: CI

# Verifies every PR (and every push to main): lint, typecheck, unit tests,
# production build, plus a Playwright smoke run. A green pipeline is the safety
# net that catches broken dependency updates — a react bump that leaves
# react-dom behind, an eslint major that crashes lint — before they reach main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # `next build` reads DATABASE_URL at module-load time but never connects
      # (see the builder stage in the Dockerfile). A syntactically valid dummy
      # is enough, so no Postgres service — and no secrets — are required. This
      # keeps CI green on Dependabot PRs, whose token is read-only.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate      # must precede lint/tsc/build — avoids stale client types
      - run: npm run lint             # standalone: next build does not run eslint
      - run: npx tsc --noEmit
      - run: npm run test             # vitest unit tests (lib/) — fast, no browser
      - run: npm run build            # the real check that react / react-dom versions agree
      - run: npm audit --audit-level=high
        continue-on-error: true       # informational — not a merge gate

  # Playwright smoke run over the public pages. Kept separate so its browser
  # download doesn't slow the fast lint/type/build feedback above. These pages
  # never hit Postgres, so a dummy DATABASE_URL is enough — no service container.
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      AUTH_SECRET: "e2e-dummy-secret-not-for-production"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate               # the dev webServer imports the client
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
