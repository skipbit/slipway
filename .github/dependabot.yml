version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # react and react-dom must move in lockstep: react-dom@X declares a peer on
    # react@^X, so a split bump leaves `npm ci` unresolvable (PR #50 failed this
    # way while #47 held react back). Grouping them with their @types ships every
    # React bump as one PR that CI can actually verify.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # next and eslint-config-next are released from the same repo on the same
      # version line and are both pinned exactly, so a split bump leaves the two
      # out of sync (#52 took next to 16.3.0 and left eslint-config-next on
      # 16.2.12). Grouping keeps the lint config matched to the framework.
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      # prisma (the CLI) and @prisma/client ship from one version line, and the
      # client the CLI generates must match the runtime that loads it;
      # @prisma/adapter-pg rides the same line. #71 arrived as a CLI-only bump
      # that would have put a 7.10.0 generator and a 7.9.1 runtime on main, with
      # no PR for the two runtime packages because open-pull-requests-limit was
      # already saturated. Grouping ships the whole line as one PR.
      prisma:
        patterns:
          - "prisma"
          - "@prisma/client"
          - "@prisma/adapter-pg"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
